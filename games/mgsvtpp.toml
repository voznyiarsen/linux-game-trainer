# Metal Gear Solid V: The Phantom Pain - Game Configuration
# Place this file in ~/.config/trainer/games/mgsvtpp.toml or ./games/mgsvtpp.toml

[metadata]
name = "Metal Gear Solid V: The Phantom Pain"
version = "1.15"
author = "FLiNG (adapted for Linux)"
description = "MGSV Trainer with 23 cheats"
executable_names = ["mgsvtpp.exe"]
steam_app_id = 287700

[process]
names = ["mgsvtpp.exe"]
case_insensitive = true
require_wine = true
module_name = "mgsvtpp.exe"

[settings]
scan_chunk_size = 65536
refresh_interval_secs = 2
auto_attach = false

