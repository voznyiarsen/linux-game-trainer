[workspace]
resolver = "2"
members = [
    "core",
    "cli",
]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.27", features = ["use-dev-tty"] }
dirs = "5.0"
nix = { version = "0.28", features = ["ptrace", "process", "signal", "user"] }
parking_lot = "0.12"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
byteorder = "1.5"
libc = "0.2"