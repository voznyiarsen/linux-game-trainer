[package]
name = "trainer_core"
version = "0.1.0"
edition = "2021"
description = "Game-agnostic trainer core: memory access, signature scanning, process management, TUI"

[dependencies]
nix = { version = "0.28", features = ["ptrace", "process", "signal", "user"] }
libc = "0.2"
regex = "1.10"
anyhow = "1.0"
thiserror = "1.0"
crossterm = { version = "0.27", features = ["use-dev-tty"] }
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
parking_lot = "0.12"
dirs = "5.0"

[lib]
name = "trainer_core"
path = "src/lib.rs"